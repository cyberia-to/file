[package]
name = "cyber-file"
version = "0.1.0"
edition = "2024"
description = "Content-addressed files, particle identities and content kinds."
license-file = "LICENSE"
repository = "https://github.com/cyberia-to/file"
readme = "README.md"
keywords = ["cyber", "file", "particle", "hemera", "content-addressed"]
categories = ["data-structures"]

[lib]
name = "file"
path = "src/lib.rs"

[dependencies]
hemera = { package = "cyber-hemera", path = "../hemera/rs" }

[lints.rust]
missing_debug_implementations = "warn"
