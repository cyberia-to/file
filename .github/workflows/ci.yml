# CI for file.
#
# file (crate cyber-file) depends on one sibling crate through a path dep
# (../hemera/rs), so every job lays out the same stand as the soft3 release
# train: file and hemera checked out side by side. hemera's rs/Cargo.toml has
# no path deps of its own, so no other sibling is needed.
# The `lockfile` job resolves that stand and uploads the resulting Cargo.lock
# as an artifact so it can be committed, then fails if the committed lock
# differs from what the stand resolves.
# The `test` job runs `cargo test --locked`, exactly the release train's
# `stack-file` gate.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # hemera's 0.4 line; set to main once hemera#25 (release/0.4 -> main) lands
  HEMERA_REF: release/0.4

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: file
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/hemera
          path: hemera
          ref: ${{ env.HEMERA_REF }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: file
      - name: resolve the stand
        run: cargo metadata --format-version 1 > /dev/null
        working-directory: file
      - name: Cargo.lock changes
        run: git -C file diff --stat -- Cargo.lock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Cargo.lock
          path: file/Cargo.lock
      - name: committed Cargo.lock matches the stand
        run: git -C file diff --exit-code -- Cargo.lock

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: file
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/hemera
          path: hemera
          ref: ${{ env.HEMERA_REF }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: file
      - name: cargo test
        run: cargo test --locked
        working-directory: file
